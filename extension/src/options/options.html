<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AHK Hotstring Clipper settings</title>
    <link rel="stylesheet" href="options.css">
    <script type="module" src="options.js"></script>
  </head>
  <body>
    <main>
      <h1>AHK Hotstring Clipper</h1>

      <section aria-labelledby="host-heading">
        <h2 id="host-heading">Native host</h2>
        <p>The extension never writes files itself. A small program on this PC does that for it, so Chrome needs to be able to reach it.</p>
        <button id="test-connection" type="button">Test connection</button>
        <div id="connection-result" role="status" aria-live="polite"></div>
      </section>

      <p class="note">Local only: nothing leaves this PC. The extension has no network access, and the host contains no networking code.</p>
    </main>
  </body>
</html>
